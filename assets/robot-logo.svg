<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer glowing shield/head -->
  <rect x="6" y="8" width="36" height="32" rx="10" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  
  <!-- Antenna -->
  <path d="M24 8V3M21 3h6" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="3" r="2.5" fill="#FCD34D"/>

  <!-- Ears / sensors -->
  <rect x="2" y="18" width="4" height="12" rx="2" fill="#D97706"/>
  <rect x="42" y="18" width="4" height="12" rx="2" fill="#D97706"/>

  <!-- Screen / Visor -->
  <rect x="11" y="15" width="26" height="13" rx="5" fill="#0F172A"/>

  <!-- Digital Eyes (Cyan glowing) -->
  <circle cx="18" cy="21.5" r="3" fill="#38BDF8"/>
  <circle cx="30" cy="21.5" r="3" fill="#38BDF8"/>
  <circle cx="19" cy="20.5" r="1" fill="#FFFFFF"/>
  <circle cx="31" cy="20.5" r="1" fill="#FFFFFF"/>

  <!-- Mouth grill / voice lines -->
  <line x1="16" y1="33" x2="32" y2="33" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="36" x2="30" y2="36" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
</svg>
